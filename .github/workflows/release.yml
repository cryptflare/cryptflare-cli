name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Node 22 ships npm 10.x. Trusted publishing needs npm >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Verify npm credentials
        # Fails fast with a readable error instead of letting `npm publish`
        # report `404 Not Found - PUT`, which looks like a missing package but
        # actually means npm rejected the credentials (it answers 404 rather
        # than 403 so the endpoint cannot be used to probe private packages).
        run: npm whoami

      - name: Verify tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test --if-present

      - name: Publish (provenance via trusted publishing)
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Published to npm: https://www.npmjs.com/package/@cryptflare/cli/v/${{ github.ref_name }}

            See [CHANGELOG.md](./CHANGELOG.md) for the canonical change log.
